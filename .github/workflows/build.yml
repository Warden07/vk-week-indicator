name: Build and test ESP8266
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - name: Calendar checks
        if: hashFiles('tests/calendar_probe.cpp') != ''
        run: |
          g++ -std=c++11 tests/calendar_probe.cpp -o /tmp/calendar_probe
          python tests/check_calendar.py /tmp/calendar_probe
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: esp8266-usb-firmware
          path: .pio/build/d1_mini/firmware.bin
